  <title id="title">A7 · Proposta grafica della mappa delle provenienze</title>
  <desc id="desc">Wireframe con venti regioni in una sagoma schematica dell'Italia, intensità petrolio, legenda e tabella alternativa. Dati inventati. Soglia minima cinque confermata; confini, insieme contato e base di pubblicazione ancora da definire. Non è una mappa implementata.</desc>
